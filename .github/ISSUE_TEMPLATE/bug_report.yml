name: Bug report / 问题反馈
description: Report a reproducible installation or editing problem.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: LocalCut version / 版本
      placeholder: 0.1.0-preview.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and hardware / 系统与硬件
      placeholder: Windows 11 x64, RAM, GPU
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result / 操作步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: Include relevant error text. Remove keys, account details and private media paths.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Runtime check / 运行包检查结果
      description: Paste the output of scripts/check-runtime.ps1 if the application does not start.
