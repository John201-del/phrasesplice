name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unit:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.ci/cache/pip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare workspace directories
        run: |
          New-Item -ItemType Directory -Force .ci/tmp, .ci/cache/pip | Out-Null
          "TEMP=$env:GITHUB_WORKSPACE/.ci/tmp" >> $env:GITHUB_ENV
          "TMP=$env:GITHUB_WORKSPACE/.ci/tmp" >> $env:GITHUB_ENV
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install official Qt binaries
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0; pin the implementation too
        with:
          version: '6.10.0'
          arch: win64_msvc2022_64
          dir: ${{ github.workspace }}/.ci/qt
          cache: false
      - name: Run isolated Qt and Python tests
        run: ./scripts/test-unit.ps1 -QtRoot $env:QT_ROOT_DIR -Generator 'Visual Studio 17 2022'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unit-results
          path: build/unit/results
          if-no-files-found: warn
